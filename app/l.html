<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>A Listworthy list for you</title>
<meta name="description" content="Someone sent you a list. Tap to add it to Listworthy.">
<meta property="og:title" content="A Listworthy list for you">
<meta property="og:description" content="Tap to add this list to Listworthy. Free on iPhone and iPad.">
<meta property="og:image" content="https://killerappz.dev/assets/appicon@2x.png">
<link rel="apple-touch-icon" href="../assets/appicon.png">
<style>
  :root { --paper:#140D0D; --card:#241819; --ox:#7A1A1A; --cream:#F3EBC8; --ink:#F6EFE6; --muted:#B9AAA2; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
         font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  main { width:100%; max-width:420px; text-align:center; }
  img.logo { width:84px; height:84px; border-radius:20px; }
  h1 { font-size:26px; line-height:1.15; margin:18px 0 6px; }
  p { color:var(--muted); margin:0 0 22px; }
  .btn { display:block; width:100%; padding:16px; border-radius:28px; font-weight:700;
         font-size:17px; text-decoration:none; margin-bottom:12px; }
  .primary { background:var(--cream); color:#5C1414; }
  .ghost { background:var(--card); color:var(--ink); border:1px solid #3A2E2E; }
  .steps { text-align:left; background:var(--card); border-radius:18px; padding:14px 18px; margin-top:18px;
           color:var(--muted); font-size:14px; }
  .steps b { color:var(--ink); }
  .err { color:#F1A8A0; }
</style>
</head>
<body>
<main>
  <img class="logo" src="../assets/appicon@2x.png" alt="Listworthy app icon">
  <h1 id="title">A list for you</h1>
  <p id="sub">Someone sent you a copy of their Listworthy list.</p>

  <a id="open" class="btn primary" href="#">Open in Listworthy</a>
  <a class="btn ghost" href="https://apps.apple.com/us/app/listworthy/id6752911163?ppid=36eddce0-e99d-46b7-b73b-88ec00af83a9&amp;pt=128166069&amp;ct=sendcopy&amp;mt=8">Get Listworthy free</a>

  <div class="steps">
    <b>New to Listworthy?</b> Get the free app, open it once, then come back to this message and tap the link again. The list drops right in.
  </div>
</main>
<script>
  (function () {
    var payload = location.hash.slice(1);
    var open = document.getElementById('open');
    if (!payload) {
      open.style.display = 'none';
      document.getElementById('sub').innerHTML = '<span class="err">This link is missing its list. Ask for it to be sent again.</span>';
      return;
    }
    open.href = 'listworthy://import?c=' + payload;

    // Show the list's name when the browser can unpack it (Safari 16.4+).
    try {
      if (!('DecompressionStream' in window)) return;
      var b64 = payload.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      var bytes = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
      var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      new Response(stream).text().then(function (txt) {
        var copy = JSON.parse(txt), list = copy.list || copy;
        if (!list || !list.name) return;
        var n = (list.items || []).length;
        document.getElementById('title').textContent = (copy.emoji ? copy.emoji + ' ' : '') + list.name;
        document.getElementById('sub').textContent = n + (n === 1 ? ' item' : ' items') + ', sent to you from Listworthy.';
        document.title = list.name + ' on Listworthy';
      }).catch(function () {});
    } catch (e) {}
  })();
</script>
</body>
</html>
