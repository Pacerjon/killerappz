<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Can you beat it? · Listworthy</title>
<meta name="description" content="A friend set a Higher or Lower score in Listworthy. Get the free app and try to beat it.">
<meta property="og:title" content="Can you beat it?">
<meta property="og:description" content="A friend set a Higher or Lower score in Listworthy. Get the free app and try to beat it.">
<meta property="og:image" content="https://killerappz.dev/assets/appicon@2x.png">
<link rel="apple-touch-icon" href="../assets/appicon.png">
<style>
  :root { --paper:#140D0D; --card:#241819; --cream:#F3EBC8; --ink:#F6EFE6; --muted:#B9AAA2; --ox:#7A1A1A; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
         font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  main { width:100%; max-width:420px; text-align:center; }
  img.logo { width:84px; height:84px; border-radius:20px; }
  .score { font-size:88px; font-weight:900; line-height:1; color:var(--cream); margin:18px 0 0; }
  h1 { font-size:24px; line-height:1.2; margin:6px 0 6px; }
  p { color:var(--muted); margin:0 0 22px; }
  .btn { display:block; width:100%; padding:16px; border-radius:28px; font-weight:700;
         font-size:17px; text-decoration:none; margin-bottom:12px; }
  .primary { background:var(--cream); color:#5C1414; }
  .ghost { background:var(--card); color:var(--ink); border:1px solid #3A2E2E; }
</style>
</head>
<body>
<main>
  <img class="logo" src="../assets/appicon@2x.png" alt="Listworthy app icon">
  <div class="score" id="score">?</div>
  <h1 id="title">in a row. Can you beat it?</h1>
  <p id="sub">A friend set a Higher or Lower score in Listworthy.</p>
  <a id="play" class="btn primary" href="#" style="display:none">Play in Listworthy</a>
  <a class="btn ghost" href="https://apps.apple.com/us/app/listworthy/id6752911163?pt=128166069&amp;ct=imessage-challenge&amp;mt=8">Get Listworthy free</a>
</main>
<script>
  (function () {
    var payload = location.hash.slice(1);
    if (!payload || !('DecompressionStream' in window)) return;
    try {
      var b64 = payload.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      var bytes = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
      var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      new Response(stream).text().then(function (txt) {
        var c = JSON.parse(txt);
        if (!c || typeof c.s !== 'number' || !c.t) return;
        document.getElementById('score').textContent = c.s;
        document.getElementById('sub').textContent = 'Higher or Lower: ' + (c.n || 'Listworthy') + '. Guess whether each one scores higher or lower.';
        var play = document.getElementById('play');
        play.href = 'listworthy://challenge?g=hilo&t=' + encodeURIComponent(c.t) + '&s=' + c.s;
        play.style.display = 'block';
        document.title = 'Beat ' + c.s + ' in a row · Listworthy';
      }).catch(function () {});
    } catch (e) {}
  })();
</script>
</body>
</html>
